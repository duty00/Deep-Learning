[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-group-project"
version = "0.1.0"
description = "HAM10000 skin lesion classification with metadata fusion and class-prior adjustment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# data: enough to build/verify the lesion-grouped split (scripts/make_splits.py, tests/test_splits.py).
data = ["numpy", "scikit-learn>=1.3"]
# See requirements-lock.txt for the recorded experiment versions.
train = ["torch", "numpy", "pandas", "scikit-learn>=1.3", "matplotlib", "tqdm", "timm", "pillow", "grad-cam"]

[project.scripts]
dl-project = "dl_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
